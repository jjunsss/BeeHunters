name: Public repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Compile Python sources
        run: python -m compileall -q configs projects scripts tests
      - name: Check public file scope
        run: python scripts/check_public_repo.py
      - name: Run dependency-free unit tests
        run: |
          python -m unittest discover -s tests -p 'test_data_tools.py' -v
          python -m unittest discover -s tests -p 'test_export_checkpoint.py' -v
          python -m unittest discover -s tests -p 'test_infer.py' -v
